<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Karen | Feliz Cumpleaños</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#FACC15',
                            500: '#EAB308',
                            600: '#CA8A04',
                            champagne: '#F3E5AB',
                            metallic: '#D4AF37'
                        },
                        darkBg: '#09090b',
                        cardBg: '#121217',
                        cardBorder: '#27272a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            overflow-x: hidden;
            position: relative;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .gold-border:hover {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
        }
        .glass-card {
            background: rgba(18, 18, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Animación para los elementos flotantes */
        @keyframes float-around {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-25px) rotate(10deg); opacity: 0.6; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
        }
        .floating-element {
            position: absolute;
            pointer-events: none;
            animation: float-around 6s ease-in-out infinite;
            z-index: 1;
            font-size: 1.8rem;
        }

        .fade-letter {
            opacity: 0;
            display: inline-block;
            transition: opacity 0.6s ease-in-out;
        }
        .fade-letter.show {
            opacity: 1;
        }

        .fade-in-buttons {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
        }
        .fade-in-buttons.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-black">

    <!-- Fondo dinámico con globos, pasteles y flores -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-gold-600/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        
        <span class="floating-element" style="top: 15%; left: 8%; animation-delay: 0s;">🎈</span>
        <span class="floating-element" style="top: 25%; right: 10%; animation-delay: 1.5s;">🌸</span>
        <span class="floating-element" style="top: 55%; left: 5%; animation-delay: 3s;">🎂</span>
        <span class="floating-element" style="top: 75%; right: 8%; animation-delay: 2s;">🌺</span>
        <span class="floating-element" style="top: 40%; left: 15%; animation-delay: 4.5s;">🎈</span>
        <span class="floating-element" style="top: 85%; left: 20%; animation-delay: 1s;">🌸</span>
        <span class="floating-element" style="top: 20%; right: 25%; animation-delay: 2.5s;">🎂</span>
        <span class="floating-element" style="top: 60%; right: 20%; animation-delay: 3.5s;">🌺</span>
    </div>

    <!-- Header minimalista -->
    <header class="relative z-10 w-full py-6 px-6 md:px-12 flex justify-between items-center border-b border-zinc-800/60 glass-card">
        <div class="flex items-center space-x-2">
            <span class="text-gold-metallic text-xl tracking-widest font-serif font-bold">KAREN</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-gold-champagne/80 font-medium">12 de Octubre</div>
    </header>

    <!-- Contenido principal (Se oculta si es antes de las 8:30 AM del 12 de octubre) -->
    <main id="main-content" class="relative z-10 flex-grow flex flex-col items-center justify-center px-6 py-16 max-w-4xl mx-auto text-center hidden">
        
        <h1 id="main-title" class="text-5xl md:text-7xl lg:text-8xl font-serif font-bold leading-tight mb-10 text-gold-champagne max-w-4xl mx-auto px-4">
            <span id="line-1"></span><br>
            <span id="line-2"></span>
        </h1>

        <div id="options-container" class="fade-in-buttons flex flex-col sm:flex-row items-center justify-center gap-6 w-full max-w-lg mx-auto">
            <a href="carta.html" target="_blank" class="w-full sm:w-auto px-8 py-4 rounded-full bg-gradient-to-r from-gold-600 via-gold-500 to-amber-400 text-black font-semibold tracking-wide transition-all duration-300 hover:scale-105 shadow-xl hover:shadow-gold-500/25 flex items-center justify-center space-x-2">
                <span>✉️</span>
                <span>Ver Carta</span>
            </a>

            <button onclick="checkGiftAccess()" class="w-full sm:w-auto px-8 py-4 rounded-full glass-card gold-border text-gold-champagne font-semibold tracking-wide transition-all duration-300 hover:scale-105 shadow-xl flex items-center justify-center space-x-2">
                <span>🎁</span>
                <span>Regalo</span>
            </button>
        </div>

        <div id="alert-box" class="hidden mt-6 p-4 rounded-2xl glass-card gold-border text-gold-champagne text-sm max-w-md mx-auto transition-all duration-300">
            🔒 Este regalo se podrá abrir mañana 12 de octubre después de las 11:00 AM. ¡Un poco de paciencia! ✨
        </div>

    </main>

    <!-- Pantalla de bloqueo si entra antes del 12 de octubre a las 8:30 AM -->
    <div id="locked-screen" class="relative z-10 flex-grow flex flex-col items-center justify-center px-6 py-16 max-w-lg mx-auto text-center hidden">
        <div class="glass-card gold-border rounded-3xl p-8 shadow-2xl space-y-4">
            <div class="text-4xl">⏳</div>
            <h2 class="text-2xl font-serif font-bold text-gold-champagne">Muy Pronto...</h2>
            <p class="text-zinc-400 text-sm leading-relaxed">
                Esta sorpresa estará disponible exclusivamente el <strong class="text-gold-champagne">12 de octubre a partir de las 8:30 AM</strong>. ¡Vuelve un poco más tarde! ✨
            </p>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            
            // Definir la fecha de desbloqueo: 12 de Octubre de 2026 a las 8:30 AM
            // Mes 9 es Octubre en JavaScript (0 a 11)
            const unlockDate = new Date(now.getFullYear(), 9, 12, 8, 30, 0);

            if (now >= unlockDate) {
                // Si ya es la hora o pasó, mostramos la página normal
                document.getElementById('locked-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                // Iniciar la animación del título letra por letra
                const line1Text = "¡Feliz Cumpleaños";
                const line2Text = "Karen!";

                const container1 = document.getElementById('line-1');
                const container2 = document.getElementById('line-2');

                line1Text.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'fade-letter';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    container1.appendChild(span);
                });

                line2Text.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'fade-letter';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    container2.appendChild(span);
                });

                const letters = document.querySelectorAll('.fade-letter');
                let index = 0;
                const delay = 100;

                function showNextLetter() {
                    if (index < letters.length) {
                        letters[index].classList.add('show');
                        index++;
                        setTimeout(showNextLetter, delay);
                    } else {
                        setTimeout(() => {
                            document.getElementById('options-container').classList.add('visible');
                        }, 500);
                    }
                }

                setTimeout(showNextLetter, 400);

            } else {
                // Si aún no es la hora (es antes del 12 a las 8:30 AM), mostramos el bloqueo
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('locked-screen').classList.remove('hidden');
            }
        });

        // Función que valida la hora para permitir la descarga de Regalo.eml (11:00 AM)
        function checkGiftAccess() {
            const now = new Date();
            // 12 de Octubre a las 11:00 AM
            const targetDate = new Date(now.getFullYear(), 9, 12, 11, 0, 0);

            if (now < targetDate) {
                const alertBox = document.getElementById('alert-box');
                alertBox.classList.remove('hidden');
                setTimeout(() => {
                    alertBox.classList.add('opacity-100');
                }, 50);
            } else {
                const fileUrl = 'https://raw.githubusercontent.com/robertojmtzj-cell/Cumplea-osKaren/4b7aafd59db5453df21ad8530489cc9b7cc755e9/Regalo.eml';
                
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = 'Regalo.eml';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
